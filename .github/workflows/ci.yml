name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: civicpulse
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: civicpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civicpulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install flake8

      - name: Lint
        run: |
          cd backend
          flake8 app --max-line-length=100 --extend-ignore=E203

      - name: Apply schema
        env:
          PGPASSWORD: changeme
        run: |
          psql -h localhost -U civicpulse -d civicpulse_test -f sql/schema/01_oltp_schema.sql
          psql -h localhost -U civicpulse -d civicpulse_test -f sql/warehouse/01_star_schema.sql

      - name: Run tests
        env:
          DATABASE_URL: postgresql://civicpulse:changeme@localhost:5432/civicpulse_test
        run: |
          cd backend
          pytest -v

  docker-build:
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f docker/Dockerfile.backend -t civicpulse-backend:ci ./backend
